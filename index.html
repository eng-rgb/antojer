<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Antojer — Urdu AI Vision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="avatar-card">
      <div class="avatar" id="avatar">
        <div class="hair"></div>
        <div class="face">
          <div class="eye left"></div><div class="eye right"></div>
          <div class="brow left"></div><div class="brow right"></div>
          <div class="nose"></div><div class="mouth" id="mouth"></div>
        </div>
      </div>
      <div class="status" id="status">پہلے کیمرہ آن کریں</div>
    </section>

    <section class="controls">
      <button id="cameraBtn">📷 کیمرہ آن کریں</button>
      <button id="micBtn" disabled>🎙️ مائیک آن کریں</button>
      <button id="stopBtn" class="secondary">⏹ روکیں</button>
    </section>

    <video id="camera" autoplay playsinline muted></video>
    <div class="caption" id="caption">کیمرہ آن کرنے کے بعد میں گفتگو شروع کروں گی۔</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
