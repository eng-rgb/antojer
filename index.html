<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antojer — Urdu AI Companion</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section class="camera-card">
      <video id="video" autoplay playsinline muted></video>
      <div id="faceBox" class="face-box"></div>
      <p class="camera-note">کیمرہ صرف مقامی presence/face detection کے لیے استعمال ہوتا ہے۔ شناخت نہیں کی جاتی۔</p>
    </section>

    <section class="character-card">
      <div id="portrait" class="portrait emotion-happy">
        <img id="characterImage" src="/character.png" alt="Antojer — fictional AI character">
        <div id="mouth" class="mouth" aria-hidden="true"></div>
        <div id="speakingGlow" class="speaking-glow" aria-hidden="true"></div>
      </div>

      <h1>انتوجر</h1>
      <p class="subtitle">ایک fictional Urdu AI companion</p>

      <div id="status" class="status">کیمرہ آن کریں۔</div>
      <div id="caption" class="caption">میں آپ سے قدرتی انداز میں اردو میں گفتگو کروں گی۔</div>

      <div class="controls">
        <button id="cameraBtn">📷 کیمرہ آن کریں</button>
        <button id="micBtn" disabled>🎙️ جواب دیں</button>
        <button id="stopBtn">⏹️ روکیں</button>
      </div>

      <p id="help" class="help">Camera On کے بعد Antojer خود بات شروع کرے گی۔ جواب دینے کے لیے “جواب دیں” دبائیں۔</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
